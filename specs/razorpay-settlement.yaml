# Arbiter reconciliation spec — Razorpay settlement ↔ bank ↔ order ledger
# This is the flagship reference spec. The engine is generic over this file.
# See docs/04-technical-architecture.md §5 and docs/adr/0003-recon-spec-as-data.md
name: razorpay-settlement
version: 3
description: >
  Reconcile a Razorpay Settlement Reconciliation Report against bank statement
  credits and the internal order ledger. Verify each net payout decomposes into
  gross - MDR - GST-on-MDR - refunds - chargebacks (± rounding).

# ------------------------------------------------------------------ sources
sources:
  razorpay_settlement:
    format: csv                # or: razorpay_api
    columns:
      settlement_id:   settlement_id
      payment_id:      payment_id
      order_id:        order_id
      gross_amount:    amount
      fee:             fee            # MDR
      tax:             tax            # GST on MDR
      type:            type           # payment | refund | adjustment | chargeback
      settled_at:      settled_at
    id_fields: [settlement_id, payment_id, order_id]
    amount_scale: rupees_to_paise
    sign_convention: { refund: negative, chargeback: negative }

  bank:
    format: csv                # or: mt940 | bai2
    columns:
      amount:       amount
      value_date:   value_date
      posted_date:  posted_date
      reference:    narration       # UTR is usually embedded here
      account:      account_no
    id_fields: [utr]
    derive:
      utr: "extract_utr(reference)"   # regex helper, deterministic
    amount_scale: rupees_to_paise

  ledger:
    format: csv
    columns:
      order_id:     order_id
      order_total:  order_total
      order_date:   order_date
      customer:     customer_name
    id_fields: [order_id]
    amount_scale: rupees_to_paise

# ------------------------------------------------------------------ the identity to verify
identity:
  target: bank.credit                      # one net credit per settlement batch
  group_by: razorpay_settlement.settlement_id
  formula: >
    sum(ledger.order_total where order_id in batch)
      - sum(razorpay_settlement.fee)
      - sum(razorpay_settlement.tax)
      + sum(razorpay_settlement.gross_amount where type == 'refund')
      + sum(razorpay_settlement.gross_amount where type == 'chargeback')
      + sum(razorpay_settlement.gross_amount where type == 'adjustment')
  rounding_tolerance_minor: 100            # ₹1

# ------------------------------------------------------------------ matching passes
passes:
  exact:
    - name: settlement_to_bank
      keys:
        - razorpay_settlement.settlement_id == bank.utr
        - bank.value_date == derived.settlement_value_date
        - abs(bank.amount - derived.net_amount) == 0
  tolerant:
    - name: settlement_to_bank_tolerant
      keys:
        - razorpay_settlement.settlement_id == bank.utr
      amount_tolerance_minor: 200          # ₹2 — FX cents / rounding
      date_window_days: 4                  # T+2 plus a weekend
  subset:
    - name: batch_to_orders
      group_by: razorpay_settlement.settlement_id
      solve_for: bank.credit
      candidate_scope: same_settlement_id_or_window
      apply: identity
      max_exact_candidates: 40             # meet-in-the-middle above this → heuristic
      wallclock_budget_ms: 1500
  fuzzy:
    - name: orphan_credit_candidates
      weigh:
        reference_jaro: 0.40
        amount_proximity: 0.30
        date_proximity: 0.20
        counterparty_similarity: 0.10
      emit: candidates_only                # never an auto-match

confidence_weights:                        # must sum to 1.0; see docs/04 §6.1
  key_agreement: 0.40
  amount_score:  0.25
  date_score:    0.15
  reference_similarity: 0.10
  shared_external_id:   0.10

thresholds:
  auto:   0.90
  review: 0.70

# ------------------------------------------------------------------ exception taxonomy
taxonomy:
  - FEE_DEDUCTION        # deduction explained, just not auto-attributed
  - TAX_DEDUCTION
  - ROUNDING
  - PARTIAL_PAYMENT
  - TIMING              # settlement straddles the period boundary
  - DUPLICATE
  - CHARGEBACK
  - FX_DIFFERENCE
  - MISSING_UTR
  - WRONG_ACCOUNT
  - UNEXPLAINED

# ------------------------------------------------------------------ deterministic rules
# The learning loop appends rules here with a provenance comment.
rules:
  - id: r_rounding
    when: "exception.residual_minor != 0 and abs(exception.residual_minor) <= 100"
    classify: ROUNDING
    resolve: accept_variance

  - id: r_timing_period_boundary
    when: "unmatched('bank') and record.value_date.day <= 3 and exists_match_in_prior_period(record)"
    classify: TIMING
    resolve: carry_forward

  - id: r_missing_utr
    when: "unmatched('bank') and is_empty(record.utr)"
    classify: MISSING_UTR
    resolve: route_to_human

  - id: r_fee_drift
    when: "match.residual_minor != 0 and abs(match.residual_minor) <= match.expected_fee_minor * 0.05"
    classify: FEE_DEDUCTION
    resolve: flag_overcharge          # feeds decomposition D5 / 'money found'

  - id: r_duplicate_payment
    when: "count_records(source='razorpay_settlement', payment_id=record.payment_id) > 1"
    classify: DUPLICATE
    resolve: route_to_human           # never auto-void money

# ------------------------------------------------------------------ AI adjudication scope
adjudication:
  invoke_for: [UNEXPLAINED, AMBIGUOUS]
  model: claude-opus-5
  effort: { default: medium, unexplained: high }
  per_exception_token_budget: 12000
  tools: [query_evidence, propose_category, draft_resolution, draft_rule]
  proposal_only: true                  # hard guarantee — see ADR-0001
