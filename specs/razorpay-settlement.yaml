# Arbiter reconciliation spec — Razorpay settlement recon ↔ bank ↔ order ledger
# Flagship reference spec. The engine is generic over this file.
# Field names match Razorpay's Settlement Recon report / `fetch-recon` API:
#   https://razorpay.com/docs/api/settlements/fetch-recon/
# See docs/04 §5, docs/11 §5, docs/12, docs/adr/0003 and 0004.
name: razorpay-settlement
version: 4
description: >
  Reconcile Razorpay Settlement Recon line items against bank statement credits and
  the internal order ledger. All line items sharing a settlement_utr must net to the
  single bank credit for that payout:
      bank_credit(settlement_utr) == Σ credit − Σ debit − Σ fee − Σ tax

# ------------------------------------------------------------------ sources
sources:
  razorpay_recon:
    format: razorpay_recon_csv          # also: razorpay_recon_api
    columns:
      entity_id:       entity_id         # settled item id (payment/refund/adjustment)
      type:            type              # payment | refund | transfer | adjustment
      debit:           debit             # paise
      credit:          credit            # paise
      amount:          amount            # paise
      fee:             fee               # MDR, paise
      tax:             tax               # GST on MDR, paise
      currency:        currency
      settlement_utr:  settlement_utr    # <-- join key to the bank credit
      settlement_id:   settlement_id
      created_at:      created_at        # unix ts
      settled_at:      settled_at        # unix ts
      payment_id:      payment_id
      order_id:        order_id
      order_receipt:   order_receipt
      method:          method            # card | upi | netbanking | wallet ...
      card_network:    card_network
      card_type:       card_type
      dispute_id:      dispute_id        # present => chargeback path
      description:     description        # UNTRUSTED (docs/14)
      notes:           notes             # UNTRUSTED (docs/14)
    id_fields: [entity_id, payment_id, order_id, settlement_utr]
    amount_scale: already_paise
    untrusted_fields: [description, notes]

  bank:
    format: bank_csv                     # also: mt940
    profiles: [hdfc, icici, axis, generic]   # column variants, auto-detected
    columns:
      amount:       amount
      value_date:   value_date
      posted_date:  posted_date
      reference:    narration            # UNTRUSTED; UTR usually embedded
      account:      account_no
    id_fields: [utr]
    derive:
      utr: "extract_utr(reference)"      # deterministic regex helper
    amount_scale: rupees_to_paise
    untrusted_fields: [narration]

  ledger:
    format: ledger_csv                   # also: tally_daybook | zoho_books
    columns:
      order_id:     order_id
      order_total:  order_total
      order_date:   order_date
      customer:     customer_name
    id_fields: [order_id]
    amount_scale: rupees_to_paise

# ------------------------------------------------------------------ the identity to verify
identity:
  target: bank.credit
  group_by: razorpay_recon.settlement_utr
  formula: >
    sum(razorpay_recon.credit)
      - sum(razorpay_recon.debit)
      - sum(razorpay_recon.fee)
      - sum(razorpay_recon.tax)
  # cross-check against the order ledger for the payment-type items:
  ledger_crosscheck: >
    sum(razorpay_recon.amount where type == 'payment')
      == sum(ledger.order_total where order_id in batch.order_ids)
  rounding_tolerance_minor: 100          # ₹1

# ------------------------------------------------------------------ matching passes
passes:
  exact:
    - name: utr_to_bank
      keys:
        - razorpay_recon.settlement_utr == bank.utr
        - abs(bank.amount - derived.net_for_utr) <= 0
  tolerant:
    - name: utr_to_bank_tolerant
      keys: [razorpay_recon.settlement_utr == bank.utr]
      amount_tolerance_minor: 200        # ₹2 — FX cents / rounding
      date_window_days: 4                # T+2 plus a weekend/holiday
  subset:
    - name: batch_items_to_credit
      group_by: razorpay_recon.settlement_utr
      solve_for: bank.credit
      apply: identity
      max_exact_candidates: 40
      wallclock_budget_ms: 1500
  fuzzy:
    - name: orphan_credit_candidates
      weigh: { reference_jaro: 0.40, amount_proximity: 0.30, date_proximity: 0.20, method_hint: 0.10 }
      emit: candidates_only

confidence_weights:                      # sum to 1.0 — docs/04 §6.1
  key_agreement: 0.45
  amount_score:  0.25
  date_score:    0.15
  reference_similarity: 0.10
  shared_external_id:   0.05

thresholds: { auto: 0.90, review: 0.70 }

# ------------------------------------------------------------------ exception taxonomy
taxonomy:
  - FEE_DEDUCTION
  - TAX_DEDUCTION
  - ROUNDING
  - PARTIAL_PAYMENT
  - TIMING                # settled_at straddles the period boundary
  - DUPLICATE
  - CHARGEBACK            # dispute_id present / adjustment reversing a payment
  - ADJUSTMENT
  - FX_DIFFERENCE
  - MISSING_UTR
  - WRONG_ACCOUNT
  - SECURITY_REVIEW       # injection-shaped content in an untrusted field (docs/14 C2)
  - UNEXPLAINED

# ------------------------------------------------------------------ deterministic rules
# The learning loop appends here with provenance comments.
rules:
  - id: r_security_scan
    when: "injection_signal(record.description) or injection_signal(record.notes) or injection_signal(bank.narration)"
    classify: SECURITY_REVIEW
    resolve: route_to_human            # never sent to the agent

  - id: r_rounding
    when: "exception.residual_minor != 0 and abs(exception.residual_minor) <= 100"
    classify: ROUNDING
    resolve: accept_variance

  - id: r_timing_period_boundary
    when: "unmatched('bank') and ts_day(record.settled_at) <= 3 and exists_match_in_prior_period(record)"
    classify: TIMING
    resolve: carry_forward

  - id: r_chargeback
    when: "not is_empty(record.dispute_id) or (record.type == 'adjustment' and record.debit > 0 and reverses_a_payment(record))"
    classify: CHARGEBACK
    resolve: route_to_human

  - id: r_missing_utr
    when: "unmatched('bank') and is_empty(record.utr)"
    classify: MISSING_UTR
    resolve: route_to_human

  - id: r_fee_drift
    when: "match.residual_minor != 0 and abs(match.residual_minor) <= expected_fee_minor(match) * 0.05"
    classify: FEE_DEDUCTION
    resolve: flag_overcharge           # decomposition D5 / 'money found'

  - id: r_duplicate_payment
    when: "count_records(source='razorpay_recon', payment_id=record.payment_id, type='payment') > 1"
    classify: DUPLICATE
    resolve: route_to_human            # never auto-void money

# ------------------------------------------------------------------ AI investigation scope
adjudication:
  invoke_for: [UNEXPLAINED, AMBIGUOUS]
  never_invoke_for: [SECURITY_REVIEW]   # hard rule — docs/14 C2
  model_policy: tiered                  # haiku triage -> opus for hard cases; see docs/12 §5
  models: { triage: claude-haiku-4-5, investigate: claude-opus-5, verify: claude-haiku-4-5 }
  triage_below_minor: 500000            # < ₹5,000 non-UNEXPLAINED -> the triage model
  effort: { investigate_default: medium, unexplained: high, triage: low }
  verify_above_minor: 10000             # ≥ ₹100 -> a 2nd model checks the cited evidence
  self_consistency_above_minor: 10000000  # ≥ ₹100,000 -> 3 samples, majority vote
  self_consistency_samples: 3
  turn_budget: 6
  per_exception_token_budget: 12000
  per_run_cost_ceiling_usd: 2.00
  tools: [query_evidence, counterparty_history, similar_exceptions, candidate_matches, decomposition_detail, propose_category, draft_resolution, draft_rule]
  proposal_only: true                   # hard guarantee — ADR-0001
  stopping: { theta_conclude: 0.80, theta_escalate: 0.55 }
  risk:                                 # Safety Kernel policy — ENGINEERING_AUDIT.md G2, spec §7
    version: razorpay-risk-v1
    material_minor: 500000              # ≥ ₹5,000 ⇒ risk tier R4; needs a confident, verified conclusion
    control_categories: [SECURITY_REVIEW, WRONG_ACCOUNT]
    escalate_material_below_conclude: true
