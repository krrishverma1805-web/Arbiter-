# Arbiter reconciliation spec — GST input-tax-credit matching
# Purpose: prove the engine is loop-agnostic. Same engine, no code changes — only this file.
# Reconciles the purchase register against GSTR-2B (auto-drafted ITC statement from GSTN)
# and the books, to protect input tax credit. See docs/03 §2.8, docs/09 Q1.
name: gst-2b
version: 1
description: >
  Match purchase invoices in the books against GSTR-2B line items from the GST portal.
  Surface: invoices in books but not in 2B (ITC at risk), invoices in 2B but not booked
  (missed ITC), and value/tax mismatches within tolerance.

sources:
  purchase_register:
    format: csv
    columns:
      supplier_gstin: gstin
      invoice_no:     invoice_number
      invoice_date:   invoice_date
      taxable_value:  taxable_value
      igst:           igst
      cgst:           cgst
      sgst:           sgst
    id_fields: [supplier_gstin, invoice_no]
    amount_scale: rupees_to_paise

  gstr_2b:
    format: csv                # GSTN JSON → CSV, or direct JSON
    columns:
      supplier_gstin: ctin
      invoice_no:     inum
      invoice_date:   idt
      taxable_value:  txval
      igst:           iamt
      cgst:           camt
      sgst:           samt
    id_fields: [supplier_gstin, invoice_no]
    amount_scale: rupees_to_paise

identity:
  target: purchase_register.total_tax
  formula: "purchase_register.igst + purchase_register.cgst + purchase_register.sgst"
  rounding_tolerance_minor: 200            # ₹2 GST rounding is common and allowed

passes:
  exact:
    - name: gstin_invoice_exact
      keys:
        - purchase_register.supplier_gstin == gstr_2b.supplier_gstin
        - normalize_invoice(purchase_register.invoice_no) == normalize_invoice(gstr_2b.invoice_no)
        - abs(purchase_register.taxable_value - gstr_2b.taxable_value) == 0
  tolerant:
    - name: gstin_invoice_tolerant
      keys:
        - purchase_register.supplier_gstin == gstr_2b.supplier_gstin
        - normalize_invoice(purchase_register.invoice_no) == normalize_invoice(gstr_2b.invoice_no)
      amount_tolerance_minor: 1000          # ₹10
      date_window_days: 45                  # 2B can lag a month
  fuzzy:
    - name: supplier_name_fallback
      weigh:
        invoice_no_jaro: 0.45
        amount_proximity: 0.35
        date_proximity: 0.20
      emit: candidates_only

confidence_weights:
  key_agreement: 0.45
  amount_score:  0.30
  date_score:    0.10
  reference_similarity: 0.15
  shared_external_id: 0.00

thresholds: { auto: 0.92, review: 0.75 }

taxonomy:
  - MATCHED_WITHIN_TOLERANCE
  - IN_BOOKS_NOT_IN_2B        # ITC at risk this period
  - IN_2B_NOT_IN_BOOKS        # missed ITC / unbooked invoice
  - VALUE_MISMATCH
  - TAX_MISMATCH
  - INVOICE_NUMBER_MISMATCH
  - AMENDMENT                 # supplier amended a prior invoice
  - UNEXPLAINED

rules:
  - id: r_tax_rounding
    when: "exception.residual_minor != 0 and abs(exception.residual_minor) <= 200"
    classify: MATCHED_WITHIN_TOLERANCE
    resolve: accept_variance

  - id: r_itc_hold
    when: "unmatched('purchase_register') and record.invoice_date within current_period"
    classify: IN_BOOKS_NOT_IN_2B
    resolve: tag_itc_hold        # block ITC this month, release when it appears in 2B

  - id: r_missed_itc
    when: "unmatched('gstr_2b')"
    classify: IN_2B_NOT_IN_BOOKS
    resolve: route_to_human

adjudication:
  invoke_for: [UNEXPLAINED, INVOICE_NUMBER_MISMATCH, AMENDMENT]
  model: claude-opus-5
  effort: { default: medium }
  per_exception_token_budget: 10000
  tools: [query_evidence, propose_category, draft_resolution, draft_rule]
  proposal_only: true
