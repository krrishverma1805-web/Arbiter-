# Hosted-mode stack (docs/13, docs/28 §3). `make demo` needs none of this — it
# runs on SQLite locally. This is the Postgres-backed deployment path:
#   docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter
      POSTGRES_DB: arbiter
    ports: ["5432:5432"]
    volumes: ["arbiter_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment: &app_env
      ARBITER_DB_URL: postgresql+psycopg://arbiter:arbiter@db:5432/arbiter
      ARBITER_ENV: prod
      ARBITER_SPECS_DIR: /app/specs
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: ["worker"]
    environment:
      <<: *app_env
      ARBITER_ASYNC: "1"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  arbiter_pgdata:
