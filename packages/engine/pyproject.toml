[project]
name = "arbiter-engine"
version = "0.0.1"
description = "Arbiter reconciliation engine: ingestion, matching, decomposition, the investigation agent, the event store, the benchmark."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "pyyaml>=6.0",
    "polars>=1.5",
    "python-dateutil>=2.9",
    "anthropic>=0.69",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
pdf = ["pypdf>=5.1"]
openai = ["openai>=1.50"]

[project.scripts]
arbiter = "arbiter_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbiter_engine"]
