[project]
name = "arbiter-api"
version = "0.0.1"
description = "Arbiter HTTP API — the cockpit backend and the customer integration surface (docs/20)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "arbiter-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["arbiter-engine[postgres]"]
observability = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "sentry-sdk[fastapi]>=2.14",
]

[project.scripts]
arbiter-api = "arbiter_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbiter_api"]
