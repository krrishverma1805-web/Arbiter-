[project]
name = "arbiter-datagen"
version = "0.0.1"
description = "Arbiter adversarial synthetic reconciliation data generator with labeled ground truth."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
arbiter-datagen = "arbiter_datagen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbiter_datagen"]
