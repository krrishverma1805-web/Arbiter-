name: ci

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy packages/engine/arbiter_engine packages/datagen/arbiter_datagen packages/api/arbiter_api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: pytest
        run: uv run pytest -q -m "not live" --cov=arbiter_engine --cov=arbiter_datagen --cov=arbiter_api --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (no committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: pip-audit (no known-vulnerable dependencies)
        run: uv run pip-audit

  determinism:
    # isolated so a failure here is unmistakable — this is the anti-cherry-pick gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: determinism + replay + resume
        run: uv run pytest -q packages/engine/tests/test_determinism.py

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: end-to-end demo + scorecard
        run: |
          uv run arbiter-datagen gen --scenario d2c --records 800 --seed 42 --out /tmp/ds
          uv run arbiter run --spec specs/razorpay-settlement.yaml --dataset /tmp/ds --json | tee /tmp/run.json
          RID=$(python -c "import json;print(json.load(open('/tmp/run.json'))['run_id'])")
          uv run arbiter replay "$RID"
          uv run arbiter verify "$RID"
          uv run arbiter bench --spec specs/razorpay-settlement.yaml --dataset /tmp/ds \
            --out scorecard.json --gate bench/baseline-800.json
      - name: absolute floor on the scorecard
        run: |
          python - <<'EOF'
          import json, sys
          s = json.load(open("scorecard.json"))
          m = s["matching"]
          assert m["false_match_rate"] <= 0.015, f"false-match rate {m['false_match_rate']} > 1.5%"
          assert m["auto_match_rate"] >= 0.80, f"auto-match rate {m['auto_match_rate']} < 80%"
          assert s["determinism"]["replay_hash_match"], "non-deterministic run"
          print("absolute floor passed:", m)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.json

  nightly-live:
    # the agent against the real API — runs on schedule only, needs the secret
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: live agent suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -q -m live

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the api / worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: false
          load: true
          tags: arbiter-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image starts and answers /healthz
        run: |
          docker run -d --name api -p 8000:8000 -e ARBITER_DB_URL=sqlite:////tmp/a.db arbiter-api:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/healthz && break || sleep 1
          done
          curl -sf localhost:8000/healthz | grep -q '"status":"ok"'
          docker rm -f api
      - name: build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: arbiter-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: the web image starts and serves the cockpit
        run: |
          docker run -d --name web -p 3000:3000 -e ARBITER_API_URL=http://127.0.0.1:8000 arbiter-web:ci
          for i in $(seq 1 30); do
            curl -sf localhost:3000/ >/dev/null && break || sleep 1
          done
          curl -sf localhost:3000/ | grep -qi arbiter
          docker rm -f web

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "3.16.2"
      - name: helm lint
        run: helm lint deploy/helm/arbiter --values deploy/helm/arbiter/ci/lint-values.yaml
      - name: render manifests
        run: helm template arb deploy/helm/arbiter --values deploy/helm/arbiter/ci/lint-values.yaml > /tmp/manifests.yaml
      - name: validate against the k8s schema
        run: |
          curl -sSL -o /tmp/kc.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -kubernetes-version 1.28.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/manifests.yaml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  recovery:
    # docs/28 §3 item 12 — the backup + restore drill: prove the event chain and
    # the projection survive a full pg_dump / drop / pg_restore round trip, on a
    # real Postgres (this also exercises the RLS migration for real).
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arbiter" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      ARBITER_DB_URL: postgresql+psycopg://arbiter:arbiter@localhost:5432/arbiter
      PGPASSWORD: arbiter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages --extra postgres
      - name: postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: migrate + a deterministic run against Postgres
        run: |
          uv run arbiter-api db upgrade
          uv run arbiter-datagen gen --scenario d2c --records 200 --seed 42 --out /tmp/ds
          uv run arbiter run --spec specs/razorpay-settlement.yaml --dataset /tmp/ds --no-ai --json | tee /tmp/run.json
          echo "RID=$(python -c "import json;print(json.load(open('/tmp/run.json'))['run_id'])")" >> "$GITHUB_ENV"
      - name: capture the terminal hash, then back up
        run: |
          uv run arbiter verify "$RID" --json | tee /tmp/before.json
          pg_dump -h localhost -U arbiter -Fc arbiter > /tmp/arbiter.dump
      - name: destroy and restore
        run: |
          psql -h localhost -U arbiter -d arbiter -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          pg_restore -h localhost -U arbiter -d arbiter --no-owner --clean --if-exists /tmp/arbiter.dump
      - name: the chain and projection are byte-identical after restore
        run: |
          uv run arbiter verify "$RID" --json | tee /tmp/after.json
          uv run arbiter replay "$RID"
          python - <<'EOF'
          import json
          b, a = json.load(open("/tmp/before.json")), json.load(open("/tmp/after.json"))
          assert a["intact"] is True, a
          assert a["terminal_hash"] == b["terminal_hash"], (b, a)
          assert a["events"] == b["events"], (b, a)
          print("restore drill passed:", a)
          EOF
