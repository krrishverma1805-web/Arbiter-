name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy packages/engine/arbiter_engine packages/datagen/arbiter_datagen

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: pytest
        run: uv run pytest -q --cov=arbiter_engine --cov=arbiter_datagen --cov-report=term-missing

  determinism:
    # isolated so a failure here is unmistakable — this is the anti-cherry-pick gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: determinism + replay + resume
        run: uv run pytest -q packages/engine/tests/test_determinism.py

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: end-to-end demo + scorecard
        run: |
          uv run arbiter-datagen gen --scenario d2c --records 800 --seed 42 --out /tmp/ds
          uv run arbiter run --spec specs/razorpay-settlement.yaml --dataset /tmp/ds --json | tee /tmp/run.json
          RID=$(python -c "import json;print(json.load(open('/tmp/run.json'))['run_id'])")
          uv run arbiter replay "$RID"
          uv run arbiter verify "$RID"
          uv run arbiter bench --spec specs/razorpay-settlement.yaml --dataset /tmp/ds --out scorecard.json
      - name: gate on the scorecard
        run: |
          python - <<'EOF'
          import json, sys
          s = json.load(open("scorecard.json"))
          m = s["matching"]
          assert m["false_match_rate"] <= 0.015, f"false-match rate {m['false_match_rate']} > 1.5%"
          assert m["auto_match_rate"] >= 0.80, f"auto-match rate {m['auto_match_rate']} < 80%"
          assert s["determinism"]["replay_hash_match"], "non-deterministic run"
          print("scorecard gate passed:", m)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.json
