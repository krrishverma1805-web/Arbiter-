# Scrape config for a local/compose Prometheus (docs/28 §3 item 11/12).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: arbiter-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: arbiter-api }
