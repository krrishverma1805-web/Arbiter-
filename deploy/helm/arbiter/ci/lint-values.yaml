    ARBITER_DB_URL: "postgresql+psycopg://arbiter:arbiter@arbiter-pgbouncer:6432/arbiter"
    ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
ingress:
  enabled: true
  host: arbiter.ci.example.com
  tls:
    enabled: true
