apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arbiter.fullname" . }}-config
  labels:
    {{- include "arbiter.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  ARBITER_API_URL: {{ .Values.web.apiUrl | quote }}
{{- if not .Values.secret.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arbiter.secretName" . }}
  labels:
    {{- include "arbiter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arbiter.serviceAccountName" . }}
  labels:
    {{- include "arbiter.labels" . | nindent 4 }}
{{- end }}
